<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FripeStore POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      overflow: hidden;
    }

    .logo-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e94560, #0f3460);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 40px rgba(233, 69, 96, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-ring svg {
      width: 48px;
      height: 48px;
      fill: white;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(233, 69, 96, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(233, 69, 96, 0.8); }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    .loader-bar {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e94560, #0f3460);
      border-radius: 10px;
      animation: load 5s ease-in-out forwards;
    }

    @keyframes load {
      0% { width: 0%; }
      40% { width: 60%; }
      80% { width: 85%; }
      100% { width: 100%; }
    }

    .status {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }

    .version {
      position: absolute;
      bottom: 16px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="logo-ring">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
    </svg>
  </div>
  <h1>FripeStore</h1>
  <p class="subtitle">Point de Vente</p>
  <div class="loader-bar">
    <div class="loader-fill"></div>
  </div>
  <p class="status" id="status">Démarrage du système...</p>
  <p class="version">v1.0.0</p>

  <script>
    const messages = [
      'Démarrage du système...',
      'Initialisation de la base de données...',
      'Chargement des produits...',
      'Presque prêt...'
    ];
    let i = 0;
    const statusEl = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      statusEl.textContent = messages[i];
    }, 1200);
  </script>
</body>
</html>
